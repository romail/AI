<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Жёлтый грузовик</title>
<style>
  :root{
    --b:clamp(56px,16vh,104px);
    --B:clamp(72px,22vh,138px);
    --gap:clamp(6px,1.4vh,14px);
  }
  @media (max-aspect-ratio:1/1){
    :root{--b:13vw;--B:19vw;--gap:1.3vw}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  html,body{margin:0;height:100%;overflow:hidden;background:#8fd3ff;overscroll-behavior:none;
    user-select:none;-webkit-user-select:none;touch-action:none;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #ui{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;
    padding:0 max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
    pointer-events:none;gap:var(--gap)}
  .grp{display:flex;gap:var(--gap);align-items:flex-end;pointer-events:none}
  .btn{pointer-events:auto;position:relative;border:clamp(3px,.8vh,6px) solid #fff;color:#fff;cursor:pointer;
    border-radius:28%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:0;font:inherit;touch-action:none;outline:none;
    box-shadow:0 clamp(5px,1vh,9px) 0 rgba(0,0,0,.28),0 10px 18px rgba(0,0,0,.2);
    transition:transform .06s,box-shadow .06s}
  .btn.down{transform:translateY(6px) scale(.97);box-shadow:0 2px 0 rgba(0,0,0,.28)}
  .dir{width:var(--b);height:var(--b)}
  .dir svg{width:62%;height:62%;fill:#fff;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
  .h{background:linear-gradient(#5aa9ff,#2f6df0)}
  .v{background:linear-gradient(#37d6b5,#14a98b)}
  .act{width:var(--B);height:var(--B)}
  .act .ico{font-size:calc(var(--B)*.46);line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.2))}
  .act .lbl{font-size:clamp(11px,2.4vh,18px);font-weight:800;letter-spacing:.02em;margin-top:2px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
  .load{background:linear-gradient(#ffa63a,#f06a0a)}
  .honk{background:linear-gradient(#ff6b6b,#d92b2b)}
  .pulse{animation:pulse .8s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 8px 0 rgba(0,0,0,.28),0 0 0 0 rgba(255,235,80,.9)}
    50%{transform:scale(1.1);box-shadow:0 8px 0 rgba(0,0,0,.28),0 0 0 16px rgba(255,235,80,0)}}
  .pulse.down{animation:none}
  #mute{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));
    width:clamp(44px,8vh,64px);height:clamp(44px,8vh,64px);border-radius:50%;border:4px solid #fff;
    background:rgba(40,60,90,.55);font-size:clamp(22px,4.4vh,34px);cursor:pointer;color:#fff;padding:0;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="mute" aria-label="Звук">🔊</button>
<div id="ui">
  <div class="grp">
    <button class="btn dir h" data-k="left" aria-label="Влево"><svg viewBox="0 0 24 24"><path d="M16 3 6 12l10 9z"/></svg></button>
    <button class="btn dir h" data-k="right" aria-label="Вправо"><svg viewBox="0 0 24 24"><path d="M8 3l10 9-10 9z"/></svg></button>
    <button class="btn dir v" data-k="up" aria-label="Вперёд"><svg viewBox="0 0 24 24"><path d="M12 4 3 16h18z"/></svg></button>
    <button class="btn dir v" data-k="down" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M12 20 3 8h18z"/></svg></button>
  </div>
  <div class="grp">
    <button class="btn act load" id="bLoad" aria-label="Погрузить"><span class="ico">⛏️</span><span class="lbl">Погрузить</span></button>
    <button class="btn act honk" id="bHonk" aria-label="Гудок"><span class="ico">📣</span><span class="lbl">Гудок</span></button>
  </div>
</div>

<script>
(() => {
'use strict';

/* ======================= утилиты ======================= */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const PI = Math.PI, TAU = PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t * t * (3 - 2 * t);
const easeOutBack = t => { const c = 1.70158; t = clamp(t, 0, 1) - 1; return 1 + (c + 1) * t * t * t + c * t * t; };
const rnd = (a, b) => a + Math.random() * (b - a);
function mulberry(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function rrect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function fs(fill, stroke, lw) {
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 4; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); }
}
function circle(x, y, r, fill, stroke, lw) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); fs(fill, stroke, lw); }
function starPath(x, y, r, rot) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = rot + i * PI / 5 - PI / 2, rr = i % 2 ? r * .46 : r;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath();
}
function heartPath(s) {
  ctx.beginPath(); ctx.moveTo(0, s * .35);
  ctx.bezierCurveTo(-s * 1.1, -s * .4, -s * .5, -s * 1.05, 0, -s * .45);
  ctx.bezierCurveTo(s * .5, -s * 1.05, s * 1.1, -s * .4, 0, s * .35); ctx.closePath();
}

/* ======================= размеры ======================= */
let W = 0, H = 0, dpr = 1, U = 1, WU = 0, HU = 0;
const L = { horizon: 0, roadTop: 0, roadBot: 0 };
const WORLD = 3700;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  U = Math.min(H / 700, W / 900);
  WU = W / U; HU = H / U;
  L.horizon = HU * .46; L.roadTop = HU * .58; L.roadBot = HU * .80;
}
window.addEventListener('resize', resize);
resize();
const laneY = l => L.roadTop + (L.roadBot - L.roadTop) * (.28 + .64 * l);

/* ======================= мир ======================= */
const PILES = [
  { type: 'sand', x: 650 },
  { type: 'rocks', x: 1250 },
  { type: 'toys', x: 1850 }
];
const SITE = { x0: 2430, gate: 2800, craneX: 3400 };

/* ======================= звук ======================= */
let ac = null, master = null, soft = null, engOsc = null, engGain = null, noiseBuf = null, muted = false;
function initAudio() {
  if (!ac) {
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; return; }
    master = ac.createGain(); master.gain.value = muted ? 0 : .8; master.connect(ac.destination);
    soft = ac.createBiquadFilter(); soft.type = 'lowpass'; soft.frequency.value = 2600; soft.connect(master);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    engOsc = ac.createOscillator(); engOsc.type = 'sawtooth'; engOsc.frequency.value = 46;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 150;
    engGain = ac.createGain(); engGain.gain.value = 0;
    engOsc.connect(lp); lp.connect(engGain); engGain.connect(master); engOsc.start();
  }
  if (ac.state === 'suspended') ac.resume();
}
function tone(f, t, d, type, v, f2) {
  if (!ac) return;
  const n = ac.currentTime + t, o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, n);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, n + d);
  g.gain.setValueAtTime(.0001, n); g.gain.exponentialRampToValueAtTime(v, n + .02); g.gain.exponentialRampToValueAtTime(.0001, n + d);
  o.connect(g); g.connect(soft); o.start(n); o.stop(n + d + .05);
}
function noise(t, d, freq, type, v) {
  if (!ac) return;
  const n = ac.currentTime + t, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = 1;
  g.gain.setValueAtTime(.0001, n); g.gain.exponentialRampToValueAtTime(v, n + .05); g.gain.exponentialRampToValueAtTime(.0001, n + d);
  s.connect(f); f.connect(g); g.connect(master); s.start(n); s.stop(n + d + .05);
}
const sHonk = () => { for (let i = 0; i < 2; i++) { tone(392, i * .27, .2, 'square', .09); tone(494, i * .27, .2, 'square', .09); } };
const sLoad = () => { noise(0, .9, 700, 'bandpass', .35); tone(140, .8, .25, 'triangle', .25, 70); tone(880, 1.2, .25, 'sine', .12); tone(1175, 1.35, .3, 'sine', .12); };
const sDump = () => { noise(.3, 1.5, 500, 'lowpass', .5); tone(90, .2, .5, 'triangle', .25, 50); tone(70, 2.2, .3, 'triangle', .25, 40); };
const sBump = () => { tone(260, 0, .2, 'triangle', .2, 150); };
function sCheer() {
  [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => tone(f, i * .11, .35, 'triangle', .2));
  [523.25, 659.25, 783.99, 1046.5].forEach(f => tone(f, .62, .8, 'sine', .11));
  for (let i = 0; i < 6; i++) tone(rnd(1500, 2600), .7 + i * .09, .18, 'sine', .07);
}
function sJingle() { [880, 1108, 1318, 1760, 1318, 1760].forEach((f, i) => tone(f, i * .1, .25, 'sine', .16)); }
function sBig() { sCheer(); setTimeout(sJingle, 700); }

/* ======================= состояние ======================= */
const truck = { x: 300, lane: .55, dir: 1, vx: 0, wheel: 0, tilt: 0, cargo: null, fill: 0, honk: 0, scale: 1, y: 0, smokeT: 0 };
const keys = { left: false, right: false, up: false, down: false };
let action = null;              // { kind:'load'|'dump', t, dur, pile, spawnT }
let cam = 0, time = 0;
let stars = 0, delivered = 0, popT = 0, celebrateT = 0;
let lb = null;                  // божья коровка (секретный подарок)
const heaps = [];
const P = [];

/* ======================= частицы ======================= */
function add(p) { p.age = 0; p.life = p.life || 1; p.rot = p.rot || 0; p.vr = p.vr || 0; P.push(p); if (P.length > 700) P.shift(); return p; }
const CONF = ['#ff5c5c', '#ffd233', '#4cd964', '#4aa8ff', '#c77dff', '#ff9f43'];
function burstStars(x, y, n, spread) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), v = rnd(120, spread || 420);
    add({ k: 'star', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 220, g: 700, s: rnd(10, 22), life: rnd(1.2, 2), vr: rnd(-5, 5) });
  }
}
function burstConfetti(x, y, n) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), v = rnd(100, 380);
    add({ k: 'conf', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 250, g: 500, s: rnd(5, 9), c: CONF[i % CONF.length], life: rnd(1.5, 2.6), vr: rnd(-9, 9) });
  }
}
function hearts(x, y, n) {
  for (let i = 0; i < n; i++)
    add({ k: 'heart', x: x + rnd(-30, 30), y, vx: rnd(-50, 50), vy: rnd(-200, -120), g: 0, s: rnd(10, 20), life: rnd(1.2, 1.8), vr: 0 });
}
function balloons(x, y, n) {
  for (let i = 0; i < n; i++)
    add({ k: 'balloon', x: x + rnd(-60, 60), y: y - rnd(0, 40), vy: rnd(-90, -55), c: CONF[i % CONF.length], ph: rnd(0, 6), s: rnd(22, 30), life: rnd(4, 6) });
}
function puff(x, y, s) { add({ k: 'puff', x, y, vx: rnd(-14, 14), vy: rnd(-50, -28), s, c: '#f5f5f5', life: rnd(.7, 1.1) }); }

function updateParticles(dt) {
  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i]; p.age += dt;
    if (p.age >= p.life) { P.splice(i, 1); continue; }
    switch (p.k) {
      case 'fly': {
        const u = p.age / p.life;
        p.x = p.sx + (p.ex - p.sx) * u; p.y = p.sy + (p.ey - p.sy) * u - Math.sin(PI * u) * p.arc; p.rot += p.vr * dt;
        if (p.age + dt >= p.life) puff(p.ex, p.ey, 8);
        break;
      }
      case 'drop':
        if (!p.landed) {
          p.vy += 1400 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
          if (p.y >= p.gy) { p.y = p.gy - rnd(0, 8); p.landed = true; p.vx = p.vy = 0; }
        }
        break;
      case 'puff': p.x += p.vx * dt; p.y += p.vy * dt; break;
      case 'balloon': p.y += p.vy * dt; p.x += Math.sin(p.age * 2 + p.ph) * 22 * dt; break;
      default: p.vy += (p.g || 0) * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    }
  }
}

/* ======================= рисование: мелочи ======================= */
const TOYS = ['cubeR', 'cubeB', 'ball', 'bear', 'cubeG', 'star', 'cubeY'];
function drawItem(kind, x, y, s) {
  ctx.save(); ctx.translate(x, y);
  const cube = c => {
    rrect(-s / 2, -s / 2, s, s, s * .16); fs(c, '#3b2a14', Math.max(2, s * .1));
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(-s * .38, -s * .38, s * .3, s * .12);
    circle(0, s * .04, s * .17, 'rgba(255,255,255,.75)');
  };
  switch (kind) {
    case 'cubeR': cube('#ff5252'); break;
    case 'cubeB': cube('#3e8bff'); break;
    case 'cubeG': cube('#3ecf6a'); break;
    case 'cubeY': cube('#ffd13a'); break;
    case 'ball':
      circle(0, 0, s * .52, '#ff6aa8', '#3b2a14', Math.max(2, s * .1));
      ctx.save(); ctx.beginPath(); ctx.arc(0, 0, s * .5, 0, TAU); ctx.clip();
      ctx.fillStyle = '#fff'; ctx.fillRect(-s, -s * .14, s * 2, s * .28);
      ctx.fillStyle = '#4aa8ff'; ctx.fillRect(-s, s * .14, s * 2, s * .18); ctx.restore();
      break;
    case 'bear':
      circle(-s * .36, -s * .38, s * .17, '#a8693a', '#3b2a14', Math.max(2, s * .08));
      circle(s * .36, -s * .38, s * .17, '#a8693a', '#3b2a14', Math.max(2, s * .08));
      circle(0, 0, s * .5, '#c98a52', '#3b2a14', Math.max(2, s * .1));
      circle(0, s * .14, s * .22, '#f1d2a8');
      circle(-s * .17, -s * .08, s * .06, '#222'); circle(s * .17, -s * .08, s * .06, '#222');
      circle(0, s * .08, s * .07, '#3b2a14');
      break;
    case 'star':
      starPath(0, 0, s * .62, 0); fs('#ffd633', '#3b2a14', Math.max(2, s * .09)); break;
  }
  ctx.restore();
}
const ROCK_R = [1, .92, 1.06, .9, 1, .94, 1.05];
function drawRock(x, y, r, shade) {
  ctx.save(); ctx.translate(x, y);
  ctx.beginPath();
  for (let i = 0; i < 7; i++) { const a = i / 7 * TAU - .4; ctx.lineTo(Math.cos(a) * r * ROCK_R[i], Math.sin(a) * r * .82 * ROCK_R[i]); }
  ctx.closePath();
  fs(shade || '#9aa1ad', '#454a55', Math.max(2, r * .12));
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.ellipse(-r * .3, -r * .3, r * .3, r * .16, -.5, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(40,44,52,.55)'; ctx.lineWidth = Math.max(1.5, r * .06);
  ctx.beginPath(); ctx.moveTo(r * .1, -r * .1); ctx.lineTo(r * .3, r * .15); ctx.lineTo(r * .15, r * .3); ctx.stroke();
  ctx.restore();
}
function drawPile(type, x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(0, 4, 140, 14, 0, 0, TAU); ctx.fill();
  if (type === 'sand') {
    ctx.beginPath(); ctx.moveTo(-130, 0); ctx.bezierCurveTo(-95, -8, -62, -95, 0, -115); ctx.bezierCurveTo(62, -95, 95, -8, 130, 0); ctx.closePath();
    const g = ctx.createLinearGradient(0, -115, 0, 0); g.addColorStop(0, '#f8dc86'); g.addColorStop(1, '#d9a94a');
    fs(g, '#8a5a1a', 5);
    ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.beginPath(); ctx.ellipse(-30, -78, 30, 12, -.6, 0, TAU); ctx.fill();
    const r = mulberry(7); ctx.fillStyle = 'rgba(138,90,26,.45)';
    for (let i = 0; i < 26; i++) { const px = rnd2(r, -90, 90), py = -rnd2(r, 6, 60); if (Math.abs(px) < 120 - py * .9) { ctx.beginPath(); ctx.arc(px, py, 2.2, 0, TAU); ctx.fill(); } }
    // ведёрко и лопатка
    ctx.beginPath(); ctx.moveTo(62, -2); ctx.lineTo(112, -2); ctx.lineTo(104, -44); ctx.lineTo(70, -44); ctx.closePath(); fs('#ff5252', '#5a1a1a', 4);
    ctx.fillStyle = '#ffe14a'; ctx.fillRect(68, -30, 38, 8);
    ctx.strokeStyle = '#5a1a1a'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(87, -46, 20, PI, TAU); ctx.stroke();
    ctx.save(); ctx.translate(-80, -10); ctx.rotate(-.5); rrect(-4, -62, 8, 62, 3); fs('#3e8bff', '#1a2f66', 3); rrect(-14, -80, 28, 26, 7); fs('#3e8bff', '#1a2f66', 3); ctx.restore();
  } else if (type === 'rocks') {
    [[-78, -34, 44, '#8f96a3'], [8, -40, 52, '#a3aab6'], [82, -30, 40, '#8f96a3'], [-34, -92, 38, '#b0b7c2'], [40, -92, 34, '#979eab'], [4, -132, 28, '#a9b0bc']]
      .forEach(a => drawRock(a[0], a[1], a[2], a[3]));
  } else {
    [[-90, -22, 40, 'cubeB'], [92, -20, 38, 'cubeY'], [-30, -26, 46, 'ball'], [34, -36, 44, 'cubeR'], [-60, -70, 44, 'star'], [4, -86, 56, 'bear'], [64, -84, 38, 'cubeG']]
      .forEach(a => drawItem(a[3], a[0], a[1], a[2]));
  }
  ctx.restore();
}
function rnd2(r, a, b) { return a + r() * (b - a); }

/* ======================= грузовик ======================= */
function rimY(x) { return -62 - 18 * (x - 14) / 148; }
function drawCargo(type, fill) {
  if (!type || fill <= .01) return;
  if (type === 'sand') {
    ctx.beginPath(); ctx.moveTo(14, rimY(14) + 12);
    const N = 14;
    for (let i = 0; i <= N; i++) { const x = 14 + 136 * i / N, k = Math.sin(PI * i / N); ctx.lineTo(x, rimY(x) + 8 - fill * (6 + 46 * Math.pow(k, .7))); }
    ctx.lineTo(150, rimY(150) + 12); ctx.closePath();
    const g = ctx.createLinearGradient(0, -130, 0, -60); g.addColorStop(0, '#f8dc86'); g.addColorStop(1, '#d9a94a');
    fs(g, '#8a5a1a', 4);
    ctx.fillStyle = 'rgba(138,90,26,.5)';
    for (let i = 0; i < 9; i++) { const x = 30 + i * 14; ctx.beginPath(); ctx.arc(x, rimY(x) - 6 - (i % 3) * 7 * fill, 2, 0, TAU); ctx.fill(); }
  } else {
    const n = 7;
    for (let i = 0; i < n; i++) {
      const f = clamp(fill * n - i, 0, 1); if (f <= 0) continue;
      const x = 24 + (i + .5) / n * 124, base = rimY(x) + 8, up = i % 2 ? 14 : 0;
      if (type === 'rocks') { const r = (i % 2 ? 24 : 30) * f; drawRock(x, base - r * .6 - up, r, i % 3 ? '#9aa1ad' : '#b0b7c2'); }
      else { const s = 30 * f; drawItem(TOYS[i % TOYS.length], x, base - s * .4 - up, s); }
    }
  }
}
function wheel(cx, cy, r, ang) {
  circle(cx, cy, r, '#2b2f38', '#12141a', 3);
  ctx.strokeStyle = '#454b57'; ctx.lineWidth = 4;

    ctx.fillStyle = b.c; ctx.fillRect(sx, hz - b.h, b.w, b.h + 2);
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    for (let wy = hz - b.h + 12; wy < hz - 14; wy += 24) for (let wx = sx + 9; wx < sx + b.w - 12; wx += 20) ctx.fillRect(wx, wy, 10, 13);
    ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fillRect(sx + b.w - 8, hz - b.h, 8, b.h + 2);
    if (b.cr) drawCrane(sx + b.w / 2, hz - b.h + 6, 170, 120, time, .62, false);
  });
  // трава
  const gg = ctx.createLinearGradient(0, hz, 0, HU); gg.addColorStop(0, '#9be063'); gg.addColorStop(.5, '#6cc84a'); gg.addColorStop(1, '#58b83e');
  ctx.fillStyle = gg; ctx.fillRect(0, hz, WU, HU - hz);
}

function drawWorldBack() {
  ctx.save(); ctx.translate(-cam, 0);
  const rt = L.roadTop, hz = L.horizon;
  // стройплощадка
  const sx0 = SITE.x0;
  ctx.fillStyle = '#dcb987'; ctx.fillRect(sx0, hz + 6, WORLD - sx0 + 200, rt - hz - 4);
  ctx.fillStyle = 'rgba(150,110,60,.28)'; for (let i = 0; i < 30; i++) ctx.fillRect(sx0 + 40 + i * 46, hz + 24 + (i * 37) % 40, 22, 5);
  // цветы
  decor.flowers.forEach(f => { const y = hz + 10 + f.y * (rt - hz - 14); if (f.x > sx0) return; const sx = f.x - cam; if (sx < -20 || sx > WU + 20) return; circle(f.x, y, 3, f.c); });
  // деревья
  decor.trees.forEach(t => { const sx = t.x - cam; if (sx < -120 || sx > WU + 120) return; drawTree(t.x, rt - 16, t.s, t.t); });
  // стройка
  drawBuildingFrame(2600, rt - 6);
  drawCrane(SITE.craneX, rt - 4, 360, 280, time, 1, true);
  drawCone(sx0 + 20, rt + 4, 1); drawCone(sx0 + 90, rt - 4, .8); drawCone(3200, rt - 2, .9); drawCone(3560, rt + 6, 1);
  drawGate(SITE.gate - 330, rt - 8);
  ctx.restore();
}

function drawRoad() {
  const rt = L.roadTop, rb = L.roadBot;
  ctx.fillStyle = '#6b7280'; ctx.fillRect(0, rt, WU, rb - rt);
  const g = ctx.createLinearGradient(0, rt, 0, rb); g.addColorStop(0, 'rgba(0,0,0,.18)'); g.addColorStop(.2, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(0, rt, WU, rb - rt);
  // бордюры
  for (let sx = -((cam % 60) + 60); sx < WU + 60; sx += 60) {
    const i = Math.round((sx + cam) / 60);
    ctx.fillStyle = i % 2 ? '#fff' : '#ff6b6b'; ctx.fillRect(sx, rt - 7, 60, 9);
    ctx.fillStyle = i % 2 ? '#e8e8e8' : '#e05555'; ctx.fillRect(sx, rb, 60, 9);
  }
  // разметка
  ctx.fillStyle = '#ffe9a0'; const my = (rt + rb) / 2 - 3;
  for (let sx = -((cam % 120) + 120); sx < WU + 120; sx += 120) ctx.fillRect(sx, my, 64, 6);
  // зона выгрузки (жёлто-чёрная полоса на дороге)
  const zx = SITE.x0 - cam;
  if (zx < WU + 100) {
    ctx.save(); ctx.beginPath(); ctx.rect(Math.max(zx, -10), rt, WU + 200, 10); ctx.clip();
    for (let sx = zx; sx < WU + 100; sx += 36) { ctx.fillStyle = '#ffd233'; ctx.fillRect(sx, rt, 18, 10); ctx.fillStyle = '#222'; ctx.fillRect(sx + 18, rt, 18, 10); }
    ctx.restore();
  }
}

function drawFront() {
  // цветы и травка на переднем плане
  ctx.save(); ctx.translate(-cam * 1.1, 0);
  decor.flowers.forEach((f, i) => {
    if (i % 2) return; const x = f.x * 1, y = L.roadBot + 24 + f.y * (HU - L.roadBot - 30);
    const sx = x - cam * 1.1; if (sx < -20 || sx > WU + 20) return;
    ctx.strokeStyle = '#3c9a2c'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 10); ctx.stroke(); circle(x, y, 4, f.c);
  });
  ctx.restore();
}

/* ======================= подсказки ======================= */
function drawArrow(tx, ty, strong) {
  const bob = Math.sin(time * 6) * 10;
  ctx.save(); ctx.translate(tx, ty + bob);
  ctx.beginPath(); ctx.moveTo(-26, -50); ctx.lineTo(26, -50); ctx.lineTo(26, -18); ctx.lineTo(44, -18); ctx.lineTo(0, 26); ctx.lineTo(-44, -18); ctx.lineTo(-26, -18); ctx.closePath();
  fs(strong ? '#ffe14a' : '#ffd233', '#c26a00', 5);
  ctx.restore();
}
function nearestPile() { let b = null, bd = 1e9; for (const p of PILES) { const d = Math.abs(truck.x - p.x); if (d < bd) { bd = d; b = p; } } return { p: b, d: bd }; }
const nearSite = () => truck.x > SITE.x0 + 40;
function hint() {
  if (action) return;
  let tx, ty, near = false;
  if (!truck.cargo) { const n = nearestPile(); tx = n.p.x; ty = L.roadTop - 150; near = n.d < 230; }
  else { tx = nearSite() ? truck.x - truck.dir * 150 : SITE.gate; ty = nearSite() ? truck.y - 250 * truck.scale : L.roadTop - 190; near = nearSite(); }
  const sx = tx - cam;
  if (sx > WU - 50) { ctx.save(); ctx.translate(WU - 46, HU * .36 + Math.sin(time * 6) * 8); ctx.beginPath(); ctx.moveTo(-30, -26); ctx.lineTo(0, -26); ctx.lineTo(0, -46); ctx.lineTo(34, 0); ctx.lineTo(0, 46); ctx.lineTo(0, 26); ctx.lineTo(-30, 26); ctx.closePath(); fs('#ffd233', '#c26a00', 5); ctx.restore(); }
  else if (sx < 50) { ctx.save(); ctx.translate(46, HU * .36 + Math.sin(time * 6) * 8); ctx.scale(-1, 1); ctx.beginPath(); ctx.moveTo(-30, -26); ctx.lineTo(0, -26); ctx.lineTo(0, -46); ctx.lineTo(34, 0); ctx.lineTo(0, 46); ctx.lineTo(0, 26); ctx.lineTo(-30, 26); ctx.closePath(); fs('#ffd233', '#c26a00', 5); ctx.restore(); }
  else drawArrow(tx, ty, near);
  bLoad.classList.toggle('pulse', near);
}

/* ======================= HUD ======================= */
function drawHUD() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const s = clamp(H * .062, 26, 54), gap = s * .25, x0 = 14 + s / 2, y0 = 14 + s / 2;
  rrect(8, 8, 5 * (s + gap) + gap + 4, s + 12, s * .5); ctx.fillStyle = 'rgba(40,70,120,.35)'; ctx.fill();
  for (let i = 0; i < 5; i++) {
    const cx = x0 + i * (s + gap) + 4, filled = i < stars;
    starPath(cx, y0 + 2, s * .52, 0);
    ctx.fillStyle = filled ? '#ffd633' : 'rgba(255,255,255,.4)'; ctx.fill();
    ctx.strokeStyle = filled ? '#e09800' : 'rgba(255,255,255,.7)'; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.stroke();
  }
  if (popT > 0) {
    const u = 1 - popT / 1.8, sc = easeOutBack(clamp(u * 3, 0, 1)) * (u > .75 ? 1 - (u - .75) * 4 : 1);
    ctx.save(); ctx.translate(W / 2, H * .3); ctx.scale(sc, sc); ctx.rotate(Math.sin(u * 6) * .15);
    const R = Math.min(W, H) * .17;
    starPath(0, 0, R, time * 1.5); ctx.fillStyle = '#ffd633'; ctx.fill(); ctx.strokeStyle = '#e09800'; ctx.lineWidth = 8; ctx.lineJoin = 'round'; ctx.stroke();
    circle(-R * .22, -R * .05, R * .06, '#7a4a00'); circle(R * .22, -R * .05, R * .06, '#7a4a00');
    ctx.strokeStyle = '#7a4a00'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(0, R * .08, R * .2, .15 * PI, .85 * PI); ctx.stroke();
    ctx.restore();
  }
}

/* ======================= действия ======================= */
const bLoad = document.getElementById('bLoad'), bHonk = document.getElementById('bHonk'), bMute = document.getElementById('mute');

function honk() {
  initAudio(); sHonk(); truck.honk = 1;
  if (lb && lb.appear >= 1 && Math.abs(truck.x - lb.x) < 380) ladyTap();
}
function pressLoad() {
  initAudio();
  if (action) return;
  if (!truck.cargo) {
    const n = nearestPile();
    if (n.d < 230) { action = { kind: 'load', t: 0, dur: 1.9, pile: n.p, spawnT: 0 }; truck.cargo = n.p.type; truck.fill = 0; sLoad(); }
    else sBump();
  } else if (nearSite()) {
    action = { kind: 'dump', t: 0, dur: 3.1, spawnT: 0, type: truck.cargo, gy: truck.y }; sDump();
  } else sBump();
}
function ladyTap() {
  if (!lb || lb.appear < 1 || lb.cool > 0) return;
  lb.cool = 1.4; lb.jump = 1; lb.gift = 1; lb.giftT = 2.4;
  sJingle();
  const gx = lb.x + 105, gy = L.roadTop - 20;
  hearts(lb.x, L.roadTop - 70, 8); burstStars(gx, gy, 18, 360); burstConfetti(gx, gy, 24); balloons(gx, gy, 6);
}

function spawnFly(pile, type) {
  const T = truck, st = T.scale;
  const base = L.roadTop + 8;
  const sx = pile.x + rnd(-45, 45), sy = base - rnd(40, 110);
  const ex = T.x - T.dir * rnd(40, 100) * st, ey = T.y - rnd(120, 150) * st;
  const p = { k: 'fly', type, sx, sy, ex, ey, x: sx, y: sy, arc: rnd(80, 160), life: .55, vr: rnd(-8, 8) };
  if (type === 'sand') { p.s = rnd(5, 8); p.c = '#e3b85a'; } else if (type === 'rocks') { p.s = rnd(9, 14); p.c = '#9aa1ad'; } else { p.s = rnd(18, 24); p.item = TOYS[Math.floor(rnd(0, TOYS.length))]; }
  add(p);
}
function spawnDrop(act) {
  const T = truck, st = T.scale, t = T.tilt;
  const x = T.x + T.dir * st * (-156 - 62 * Math.sin(t)), y = T.y + st * (-86 - 62 * Math.cos(t));
  const p = { k: 'drop', type: act.type, x, y, vx: -T.dir * rnd(40, 110), vy: rnd(-60, 0), gy: act.gy - rnd(0, 6), life: 9, vr: rnd(-6, 6) };
  if (act.type === 'sand') { p.s = rnd(5, 8); p.c = '#e3b85a'; } else if (act.type === 'rocks') { p.s = rnd(10, 16); p.c = '#9aa1ad'; } else { p.s = rnd(18, 24); p.item = TOYS[Math.floor(rnd(0, TOYS.length))]; }
  add(p);
}

function finishDump(act) {
  const T = truck, st = T.scale;
  const hx = T.x - T.dir * 200 * st;
  heaps.push({ type: act.type, x: hx, y: act.gy, g: 0, s: st });
  if (heaps.length > 5) heaps.shift();
  P.forEach(p => { if (p.k === 'drop') p.life = Math.min(p.life, p.age + .35); });
  T.cargo = null; T.fill = 0; T.tilt = 0;
  delivered++; stars++; popT = 1.8;
  burstStars(hx, act.gy - 90, 26, 460); burstConfetti(hx, act.gy - 90, 20);
  if (stars >= 5) { celebrateT = 2.6; burstStars(T.x, T.y - 200, 40, 600); burstConfetti(T.x, T.y - 200, 50); sBig(); }
  else sCheer();
  if (delivered >= 3 && !lb) { lb = { x: SITE.x0 + 560, appear: 0, jump: 0, gift: 0, giftT: 0, cool: 0 }; setTimeout(() => { hearts(lb.x, L.roadTop - 80, 5); burstStars(lb.x, L.roadTop - 80, 12, 280); }, 700); }
}

/* ======================= обновление ======================= */
function update(dt) {
  const T = truck;
  // ввод
  let tx = 0, ly = 0;
  if (!action) { if (keys.left) tx -= 1; if (keys.right) tx += 1; if (keys.up) ly -= 1; if (keys.down) ly += 1; }
  if (tx) T.dir = tx;
  T.vx += (tx - T.vx) * Math.min(1, dt * 4.5);
  if (Math.abs(T.vx) < .005) T.vx = 0;
  const dx = T.vx * 360 * dt;
  T.x = clamp(T.x + dx, 120, WORLD - 120);
  T.lane = clamp(T.lane + ly * dt * .8, 0, 1);
  T.scale = .9 + .25 * T.lane; T.y = laneY(T.lane);
  T.wheel += dx / (34 * T.scale);
  T.honk = Math.max(0, T.honk - dt / 1.1);

  // дым из трубы
  T.smokeT -= dt;
  if (T.smokeT <= 0) { T.smokeT = Math.abs(T.vx) > .1 ? .09 : .55; puff(T.x + T.dir * 6 * T.scale, T.y - 205 * T.scale, (Math.abs(T.vx) > .1 ? 10 : 7) * T.scale); }

  // действия
  if (action) {
    const a = action; a.t += dt;
    if (a.kind === 'load') {
      a.spawnT -= dt;
      if (a.t > .1 && a.t < 1.35 && a.spawnT <= 0) { a.spawnT = .06; spawnFly(a.pile, a.pile.type); }
      T.fill = ease(clamp((a.t - .35) / 1.4, 0, 1));
      T.tilt = Math.sin(clamp(a.t / a.dur, 0, 1) * PI) * .05;
      if (a.t >= a.dur) { T.fill = 1; T.tilt = 0; action = null; burstStars(T.x - T.dir * 70 * T.scale, T.y - 150 * T.scale, 8, 200); }
    } else {
      const t = a.t;
      if (t < .9) T.tilt = .62 * ease(t / .9);
      else if (t < 2.0) T.tilt = .62 + Math.sin(t * 25) * .012;
      else T.tilt = .62 * (1 - ease(clamp((t - 2.0) / 1.0, 0, 1)));
      T.fill = t < .6 ? 1 : clamp(1 - (t - .6) / 1.4, 0, 1);
      a.spawnT -= dt;
      if (t > .7 && t < 2.0 && a.spawnT <= 0) { a.spawnT = .035; spawnDrop(a); }
      if (t >= a.dur) { action = null; finishDump(a); }
    }
  }

  // камера
  const target = clamp(T.x + T.dir * 90 - WU / 2, 0, Math.max(0, WORLD - WU));
  cam += (target - cam) * Math.min(1, dt * 3);
  cam = clamp(cam, 0, Math.max(0, WORLD - WU));

  // куча
  heaps.forEach(h => { h.g = Math.min(1, h.g + dt * 2.2); });
  // всякое
  if (popT > 0) popT = Math.max(0, popT - dt);
  if (celebrateT > 0) { celebrateT -= dt; if (Math.random() < dt * 10) burstConfetti(cam + rnd(80, WU - 80), rnd(30, 200), 6); if (celebrateT <= 0) stars = 0; }
  if (lb) {
    lb.appear = Math.min(1, lb.appear + dt * .8);
    if (lb.jump > 0) lb.jump = Math.max(0, lb.jump - dt / .8);
    if (lb.cool > 0) lb.cool -= dt;
    if (lb.giftT > 0) { lb.giftT -= dt; if (lb.giftT <= 0) lb.gift = 0; }
    if (lb.appear >= 1 && lb.cool <= 0 && Math.abs(T.x - lb.x) < 200 && !lb.greeted) { lb.greeted = true; hearts(lb.x, L.roadTop - 80, 3); }
    if (Math.abs(T.x - lb.x) > 500) lb.greeted = false;
  }
  updateParticles(dt);

  // звук мотора
  if (engGain) {
    const v = Math.abs(T.vx);
    engGain.gain.setTargetAtTime(muted ? 0 : .012 + v * .05, ac.currentTime, .1);
    engOsc.frequency.setTargetAtTime(44 + v * 34, ac.currentTime, .1);
  }
}

/* ======================= отрисовка ======================= */
function drawParticle(p) {
  const u = p.age / p.life;
  ctx.save(); ctx.translate(p.x, p.y);
  switch (p.k) {
    case 'fly': case 'drop': {
      if (p.k === 'drop' && p.life - p.age < .35) ctx.globalAlpha = (p.life - p.age) / .35;
      ctx.rotate(p.rot);
      if (p.type === 'sand') circle(0, 0, p.s, p.c, 'rgba(138,90,26,.6)', 1.5);
      else if (p.type === 'rocks') drawRock(0, 0, p.s, p.c);
      else drawItem(p.item, 0, 0, p.s);
      break;
    }
    case 'puff': ctx.globalAlpha = (1 - u) * .75; circle(0, 0, p.s * (1 + u * 1.6), p.c); break;
    case 'star': ctx.globalAlpha = u > .7 ? (1 - u) / .3 : 1; starPath(0, 0, p.s, p.rot); fs('#ffd633', '#e09800', 2.5); break;
    case 'conf': ctx.globalAlpha = u > .75 ? (1 - u) / .25 : 1; ctx.rotate(p.rot); ctx.fillStyle = p.c; ctx.fillRect(-p.s, -p.s * .5, p.s * 2, p.s); break;
    case 'heart': ctx.globalAlpha = u > .6 ? (1 - u) / .4 : 1; heartPath(p.s); fs('#ff5c8a', '#c2185b', 2); break;
    case 'balloon': {
      ctx.globalAlpha = u > .85 ? (1 - u) / .15 : 1;
      ctx.strokeStyle = 'rgba(60,60,60,.6)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, p.s * 1.1); ctx.quadraticCurveTo(8, p.s * 2, 0, p.s * 3); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0, 0, p.s * .8, p.s, 0, 0, TAU); fs(p.c, 'rgba(0,0,0,.35)', 2);
      ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.ellipse(-p.s * .28, -p.s * .35, p.s * .15, p.s * .3, .4, 0, TAU); ctx.fill();
      break;
    }
  }
  ctx.restore();
}

function render() {
  ctx.setTransform(dpr * U, 0, 0, dpr * U, 0, 0);
  drawBackground();
  drawWorldBack();
  drawRoad();
  ctx.save(); ctx.translate(-cam, 0);
  const items = [];
  PILES.forEach(p => items.push({ y: L.roadTop + 8, d: () => drawPile(p.type, p.x, L.roadTop + 8, 1) }));
  heaps.forEach(h => items.push({ y: h.y, d: () => drawPile(h.type, h.x, h.y, .55 * h.s * easeOutBack(h.g)) }));
  if (lb) items.push({ y: L.roadTop + 18, d: drawLady });
  items.push({ y: truck.y, d: drawTruck });
  items.sort((a, b) => a.y - b.y).forEach(i => i.d());
  P.forEach(drawParticle);
  hint();
  ctx.restore();
  drawFront();
  drawHUD();
}

/* ======================= управление ======================= */
function bindHold(btn) {
  const k = btn.dataset.k;
  const down = e => { e.preventDefault(); initAudio(); try { btn.setPointerCapture(e.pointerId); } catch (_) { } keys[k] = true; btn.classList.add('down'); };
  const up = () => { keys[k] = false; btn.classList.remove('down'); };
  btn.addEventListener('pointerdown', down);
  ['pointerup', 'pointercancel', 'lostpointercapture', 'pointerleave'].forEach(ev => btn.addEventListener(ev, up));
  btn.addEventListener('contextmenu', e => e.preventDefault());
}
document.querySelectorAll('.dir').forEach(bindHold);
function bindTap(btn, fn) {
  btn.addEventListener('pointerdown', e => { e.preventDefault(); btn.classList.add('down'); fn(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => btn.addEventListener(ev, () => btn.classList.remove('down')));
  btn.addEventListener('contextmenu', e => e.preventDefault());
}
bindTap(bLoad, pressLoad); bindTap(bHonk, honk);
bMute.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio(); muted = !muted; bMute.textContent = muted ? '🔇' : '🔊';
  if (master) master.gain.value = muted ? 0 : .8;
});

cv.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio();
  const ux = e.clientX / U + cam, uy = e.clientY / U;
  if (lb && lb.appear >= 1 && Math.hypot(ux - lb.x, uy - (L.roadTop - 30)) < 100) { ladyTap(); return; }
  if (Math.abs(ux - truck.x) < 170 * truck.scale && uy < truck.y && uy > truck.y - 200 * truck.scale) honk();
});

const KEYMAP = { ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right', ArrowUp: 'up', w: 'up', ArrowDown: 'down', s: 'down' };
window.addEventListener('keydown', e => {
  const k = KEYMAP[e.key]; if (k) { keys[k] = true; initAudio(); e.preventDefault(); return; }
  if (e.repeat) return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); pressLoad(); }
  else if (e.key === 'b' || e.key === 'h') honk();
});
window.addEventListener('keyup', e => { const k = KEYMAP[e.key]; if (k) keys[k] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; document.querySelectorAll('.btn.down').forEach(b => b.classList.remove('down')); });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

/* ======================= цикл ======================= */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; time += dt;
  update(dt); render();
  requestAnimationFrame(frame);
}
cam = clamp(truck.x - WU / 2, 0, WORLD - WU);
requestAnimationFrame(frame);
window.__game = { truck, keys, PILES, SITE, pressLoad, honk, get state() { return { stars, delivered, action, lb: !!lb, cargo: truck.cargo }; } };
})();
</script>
